name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Decode stable CI signing key
        run: |
          mkdir -p app/ci
          base64 -d app/ci/relay-update.keystore.b64 > app/ci/relay-update.keystore

      - name: Build debug APK
        env:
          RELAY_DEBUG_KEYSTORE_PATH: app/ci/relay-update.keystore
          RELAY_DEBUG_KEYSTORE_PASSWORD: relayupdate
          RELAY_DEBUG_KEY_ALIAS: relayupdate
          RELAY_DEBUG_KEY_PASSWORD: relayupdate
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 0.1.${{ github.run_number }}
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-watch-relay-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
